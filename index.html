<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1B3B6F"><title>Who Am I? — Pharmacology Flashcards</title>
<style>
:root{--head:#1B3B6F;--ink:#1F2937;--mut:#6B7280;--bg:#FFFFFF;--card:#fff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overscroll-behavior:none}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.pal0{background:#E8703A}.pal1{background:#2E8B57}.pal2{background:#1C86C4}.pal3{background:#8E44AD}.pal4{background:#D6336C}.pal5{background:#0E8C86}
button{font-family:inherit;cursor:pointer;border:none}
/* start screen */
.hero{background:var(--head);color:#fff;padding:34px 22px 26px;border-radius:0 0 26px 26px}
.hero .kick{font-size:13px;letter-spacing:2px;font-weight:700;color:#AEC6EA;margin:0}
.hero h1{font-size:30px;margin:6px 0 4px;font-weight:800}
.hero p{margin:0;color:#D3DEF2;font-size:15px}
.wrap{padding:18px 16px 28px}
.sec{font-size:12px;letter-spacing:1.5px;font-weight:800;color:var(--mut);margin:18px 4px 8px;text-transform:uppercase}
.setbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);border:2px solid transparent;transition:.15s}
.setbtn:active{transform:scale(.99)}
.setbtn.sel{border-color:var(--head)}
.setbtn .big{font-weight:700;font-size:18px}
.setbtn .small{color:var(--mut);font-size:14px;margin-top:2px}
.count{margin-left:auto;background:#E8EEF7;color:var(--head);border-radius:12px;padding:6px 12px;min-width:52px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.count b{font-size:16px;font-weight:800}
.count i{font-style:normal;font-size:11px;font-weight:800;color:#2E8B57;min-height:13px}
.summary{display:flex;align-items:center;gap:16px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:4px}
.ring{--p:0;width:62px;height:62px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--head) calc(var(--p)*1%),#e3e9eb 0)}
.ring span{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--head)}
.sbig{font-weight:800;font-size:18px}
.ssmall{color:var(--mut);font-size:14px;margin-top:3px}
.ssmall a{color:#C0392B;font-weight:700;text-decoration:underline;cursor:pointer}
.note{background:#E8EEF7;color:#1B3B6F;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;margin:8px 0}
.startbar{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,247,248,0),var(--bg) 40%)}
.primary{width:100%;background:var(--head);color:#fff;font-size:18px;font-weight:800;border-radius:16px;padding:16px}
.primary:disabled{opacity:.4}
.toggle{display:flex;align-items:center;gap:10px;margin:14px 4px;color:var(--ink);font-size:16px}
.sw{width:46px;height:28px;border-radius:16px;background:#cfd6da;position:relative;transition:.15s;flex:none}
.sw.on{background:var(--head)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{left:21px}
/* play screen */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px calc(6px);}
.iconbtn{background:#fff;border-radius:12px;width:42px;height:42px;font-size:19px;color:var(--head);box-shadow:0 1px 2px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.prog{flex:1}
.bar{height:8px;background:#e3e9eb;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--head);width:0;transition:.25s}
.ptext{font-size:13px;color:var(--mut);font-weight:700;margin-top:4px;text-align:center}
.stage{padding:6px 14px 0;display:flex}
.card{background:var(--card);border-radius:22px;box-shadow:0 6px 22px rgba(0,0,0,.09);width:100%;display:flex;flex-direction:column;overflow:hidden}
.face{padding:18px 18px 8px;flex:1;overflow:auto}
.whoami{color:var(--head);font-weight:800;font-size:26px;margin:2px 2px 12px}
.clue{display:flex;align-items:center;gap:13px;margin:11px 0}
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;padding:10px}
.ic svg{display:block}
.clue .txt{font-size:18px;line-height:1.35}
.ansname{font-weight:800;font-size:28px;margin:2px 2px 2px}
.anssub{color:var(--mut);font-style:italic;font-size:16px;margin:0 2px 12px}
.chip{display:inline-block;color:#fff;font-weight:800;font-size:11px;letter-spacing:1px;border-radius:20px;padding:5px 12px;margin:2px}
.fact{display:flex;gap:10px;margin:8px 0;align-items:stretch}
.flabel{flex:none;width:94px;border-radius:10px;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.ftext{font-size:16px;line-height:1.35;padding:4px 2px}
.actions{padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.reveal{flex:1;background:var(--head);color:#fff;font-size:18px;font-weight:800;border-radius:15px;padding:15px}
.grade{flex:1;font-size:17px;font-weight:800;border-radius:15px;padding:15px;color:#fff}
.know{background:#2E8B57}.again{background:#E8703A}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:6px 4px 0;line-height:1.35}
/* end */
.endwrap{padding:40px 22px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
.endwrap h2{font-size:28px;margin:0 0 6px}
.big2{font-size:60px;font-weight:800;color:var(--head);margin:12px 0}
.statrow{display:flex;gap:12px;justify-content:center;margin:16px 0}
.stat{background:#fff;border-radius:16px;padding:14px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--mut)}
.hidden{display:none}
</style></head><body><div id="app"></div>
<script>
const DATA={"drugs":[{"id":0,"group":"Pharmacology Review","cat":"cv","name":"Furosemide","sub":"Loop diuretic  ·  Lasix","clues":[["I’m fast. I’m furious.","speed"],["I’m potent.","bolt"],["I’m efficient.","gear"],["I love Roller Coaster Loops.","loop"],["I’ll scream so loud, I might damage your ears.","ear"],["My love for Loops will make you Lose Calcium.","bone"],["Don’t say I didn’t warn you — dehydration & electrolyte imbalances.","droplet"],["I can reduce BP and remove fluids.","heart"]],"facts":[["Class","Loop diuretic — potent"],["Action","Blocks Na-K-2Cl in the loop of Henle → strong diuresis"],["Uses","Edema (HF, renal, hepatic), pulmonary edema, hypertension"],["Watch for","Hypokalemia, hypocalcemia, dehydration, ototoxicity"],["Nursing pearl","Monitor electrolytes, I&O, daily weight; give IV slowly"]]},{"id":1,"group":"Pharmacology Review","cat":"abx","name":"Azithromycin / Erythromycin","sub":"Macrolide antibiotic  ·  “Z-pack”","clues":[["I’m no big MAC, but I can RO-ll down a LIDE and slide.","bacteria"],["I like to THROW stuff off balance — especially your liver and ECG.","heart"]],"facts":[["Class","Macrolide antibiotic"],["Action","Inhibits bacterial protein synthesis (50S ribosome)"],["Uses","Respiratory infections, atypical pneumonia, some STIs"],["Watch for","QT prolongation (ECG), hepatotoxicity, GI upset"],["Nursing pearl","Screen for QT drugs and cardiac history"]]},{"id":2,"group":"Pharmacology Review","cat":"abx","name":"Penicillin","sub":"Amoxicillin  ·  + clavulanate = Augmentin","clues":[["I’m an old soul.","clock"],["Many folks have an allergic reaction to me.","rash"],["I was over-prescribed, so people developed resistance to me.","bacteria"],["Combined with Clavulanic Acid I become Augmentin — famous for sinus infections & strep.","pills"]],"facts":[["Class","Penicillin-class antibiotic"],["Action","Inhibits cell-wall synthesis (bactericidal)"],["Uses","Sinusitis, otitis, strep throat"],["Watch for","Allergic / anaphylactic reactions, rash, GI upset"],["Nursing pearl","Always ask about penicillin allergy; finish the course"]]},{"id":3,"group":"Pharmacology Review","cat":"cv","name":"Hydrochlorothiazide","sub":"Thiazide diuretic  ·  HCTZ","clues":[["I help eliminate salt and water.","droplet"],["I’m slow and steady.","clock"],["I keep calcium for healthy bones.","bone"],["I’m famous for reducing BP and mild edema.","heart"],["I work at the kidneys.","kidney"]],"facts":[["Class","Thiazide diuretic"],["Action","Blocks Na/Cl reabsorption in the distal tubule"],["Uses","Hypertension, mild edema"],["Watch for","Hypokalemia, hyperglycemia, hyperuricemia (keeps calcium)"],["Nursing pearl","Monitor K⁺ and glucose; dose in the morning"]]},{"id":4,"group":"Pharmacology Review","cat":"abx","name":"Vancomycin","sub":"Glycopeptide antibiotic","clues":[["Hop into my red van, so we can slowly cruise around town.","van"],["Slow down that IV or you get a red ticket labeled Red Man.","syringe"],["Can you hear me all right?","ear"],["CHECK THAT KIDNEY FUNCTION.","kidney"]],"facts":[["Class","Glycopeptide antibiotic"],["Action","Inhibits cell-wall synthesis; covers MRSA / C. diff"],["Uses","Serious gram-positive infections, MRSA"],["Watch for","Red Man syndrome (infuse slowly), nephro/ototoxicity"],["Nursing pearl","Monitor trough levels and kidney function"]]},{"id":5,"group":"Pharmacology Review","cat":"cv","name":"Spironolactone","sub":"Potassium-sparing diuretic  ·  Aldactone","clues":[["I’m famous for causing HYPERKALEMIA.","warning"],["But I still remove salt and water.","droplet"],["I reduce BP.","heart"],["Don’t eat extra bananas and avocados with me.","banana"]],"facts":[["Class","K⁺-sparing diuretic (aldosterone antagonist)"],["Action","Blocks aldosterone → keeps K⁺, excretes Na/water"],["Uses","Heart failure, hypertension, edema"],["Watch for","HYPERKALEMIA, gynecomastia"],["Nursing pearl","Avoid K⁺ supplements/salt substitutes & high-K foods"]]},{"id":6,"group":"Pharmacology Review","cat":"abx","name":"Ciprofloxacin","sub":"Fluoroquinolone","clues":[["My black-box warning: Floppy Floxxy Tendons — especially in athletes and older adults.","running"],["I belong to the class: Fluoroquinolones.","bacteria"]],"facts":[["Class","Fluoroquinolone antibiotic"],["Action","Inhibits DNA gyrase / topoisomerase"],["Uses","UTI, respiratory, GI infections"],["Watch for","Tendon rupture (black box), QT, photosensitivity"],["Nursing pearl","Separate from calcium/antacids; caution in elderly"]]},{"id":7,"group":"Pharmacology Review","cat":"abx","name":"Metronidazole","sub":"Flagyl","clues":[["I take the Metro Train to Camp.","train"],["We hike a lot at camp — I don’t drink much water, so my urine is dark.","hiking"],["No alcohol allowed at camp — I get sick if I drink.","wine"],["Every morning we gather by the metallic flag pole.","flag"]],"facts":[["Class","Antibiotic / antiprotozoal"],["Action","Damages microbial DNA (anaerobes & protozoa)"],["Uses","C. diff, bacterial vaginosis, trichomonas, anaerobes"],["Watch for","Disulfiram reaction with alcohol, metallic taste, dark urine"],["Nursing pearl","NO alcohol during and for 3 days after"]]},{"id":8,"group":"Pharmacology Review","cat":"abx","name":"Sulfa Antibiotics","sub":"Sulfamethoxazole-Trimethoprim (Bactrim)","clues":[["I am an antibiotic Superhero.","mask"],["BUT I’m NOT solar powered — don’t put me in the sun.","sun"],["My superpower: Krystals in your Kidney.","gem"],["How will you protect yourself from my superpower?","droplet"]],"facts":[["Class","Sulfonamide antibiotic"],["Action","Blocks bacterial folate synthesis"],["Uses","UTI, PCP prophylaxis, MRSA skin infections"],["Watch for","Photosensitivity, crystalluria, rash (SJS), hyperkalemia"],["Nursing pearl","Push fluids to prevent kidney crystals; use sunscreen"]]},{"id":9,"group":"Pharmacology Review","cat":"abx","name":"Doxycycline","sub":"Tetracycline","clues":[["If you’re under 8, don’t use me — your teeth will turn yellow.","tooth"],["Sit up after taking me, especially ic (beta-lactam)"],["Action","Inhibits bacterial cell-wall synthesis"],["Uses","Skin, respiratory, and urinary infections"],["Watch for","Possible cross-reactivity with penicillin allergy"],["Nursing pearl","Ask about penicillin allergy; avoid alcohol"]]},{"id":13,"group":"Pharmacology Review","cat":"cv","name":"ACE Inhibitors (Lisinopril)","sub":"“-pril”","clues":[["I BLOCK Angie I from becoming Angie 2.","ban"],["With NO angie 2, blood vessels relax and dilate.","dilate"],["I also tell ALDOSODIUM not to hold sodium.","droplet"],["But hey — I WILL keep a Potassium in return.","warning"],["I reduce BP without affecting heart rate.","heart"]],"facts":[["Class","ACE inhibitor"],["Action","Blocks angiotensin I→II; vessels dilate, keeps K⁺"],["Uses","Hypertension, heart failure, kidney protection in diabetes"],["Watch for","Dry cough, hyperkalemia, angioedema; avoid pregnancy"],["Nursing pearl","Monitor potassium and kidney function"]]},{"id":14,"group":"Pharmacology Review","cat":"cv","name":"Prazosin","sub":"Alpha-1 blocker","clues":[["My superpower: blocking Alpha receptors to cause VASODILATION.","dilate"],["I cause first-dose hypotension.","warning"],["My biggest enemy: the “Phils” — I must take them 12 hours apart.","clock"]],"facts":[["Class","Alpha-1 adrenergic blocker"],["Action","Blocks alpha-1 receptors → vasodilation"],["Uses","Hypertension; BPH urinary symptoms; PTSD nightmares"],["Watch for","Orthostatic hypotension, first-dose fainting"],["Nursing pearl","Separate from PDE-5 “-afil” drugs (sildenafil) → severe ↓BP"]]},{"id":15,"group":"Pharmacology Review","cat":"cv","name":"Nitroglycerin SL","sub":"Nitrate vasodilator","clues":[["Stick me under your tongue.","tongue"],["I open up the coronary arteries.","heart"],["Sit tight after taking me.","warning"],["Take a Tylenol if you get a headache from the vasodilation.","pills"],["No more than 3 doses every 5 minutes — then call 911.","clock"]],"facts":[["Class","Nitrate vasodilator"],["Action","Releases nitric oxide → dilates coronary arteries"],["Uses","Angina / chest pain, acute coronary events"],["Watch for","Headache, hypotension, dizziness"],["Nursing pearl","SL, up to 3 doses 5 min apart—call 911; dark glass bottle; no PDE-5"]]},{"id":16,"group":"Pharmacology Review","cat":"gi","name":"Lactulose","sub":"Osmotic laxative","clues":[["I’m a sweet syrup that draws water into the colon.","bottle"],["I soften stool and treat hepatic encephalopathy.","poop"],["I lower ammonia by trapping it in the colon.","brain"],["I may cause gas, bloating, or diarrhea.","wind"],["Monitor electrolytes with long-term use.","vial"]],"facts":[["Class","Osmotic laxative"],["Action","Draws water into the colon; traps ammonia"],["Uses","Constipation; hepatic encephalopathy (lowers ammonia)"],["Watch for","Gas, bloating, diarrhea; electrolyte shifts"],["Nursing pearl","Titrate to 2–3 soft stools/day in liver disease"]]},{"id":17,"group":"Pharmacology Review","cat":"gi","name":"Calcium Carbonate","sub":"Antacid  ·  Tums","clues":[["I’m OTC.","pills"],["I’m rich in calcium and can cause constipation.","bone"],["I physically bind with stomach acid.","stomach"],["Best used short-term for acid reflux and GERD.","fire"],["I can cause Milk-Alkali Syndrome.","glass"]],"facts":[["Class","Antacid (OTC)"],["Action","Directly neutralizes stomach acid"],["Uses","Heartburn, mild GERD; calcium source"],["Watch for","Constipation; milk-alkali syndrome"],["Nursing pearl","Short-term use; separate from other medications"]]},{"id":18,"group":"Pharmacology Review","cat":"gi","name":"Famotidine","sub":"H2 blocker  ·  “-tidine”","clues":[["I’m an H2-receptor blocker.","shield"],["I reduce acid secretion from parietal cells.","stomach"],["I’m usually used for heartburn or mild GERD.","fire"],["Take me before you “to-dine.”","utensils"]],"facts":[["Class","H2-receptor antagonist"],["Action","Blocks histamine at parietal cells → less acid"],["Uses","Heartburn, GERD, ulcers"],["Watch for","Generally well tolerated"],["Nursing pearl","Fewer interactions than PPIs; take before meals"]]},{"id":19,"group":"Pharmacology Review","cat":"gi","name":"PPIs (Omeprazole)","sub":"Proton pump inhibitor  ·  “-prazole”","clues":[["I’m available OTC and Rx.","pills"],["I inhibit the H⁺/K⁺ ATPase pump in the stomach.","stomach"],["I reduce gastric acid production at the source.","fire"],["Best taken before the first meal of the day.","utensils"],["Long-term use raises risk of fractures and B12 deficiency.","bone"]],"facts":[["Class","Proton pump inhibitor (PPI)"],["Action","Blocks the H⁺/K⁺ ATPase pump → strong acid suppression"],["Uses","GERD, ulcers, part of H. pylori regimens"],["Watch for","Long term: fractures, low B12/Mg, C. diff"],["Nursing pearl","Take 30–60 min before the first meal"]]},{"id":20,"group":"Pharmacology Review","cat":"gi","name":"Sucralfate","sub":"Mucosal protectant","clues":[["I don’t affect acid secretion directly.","ban"],["I interfere with absorption of other meds.","warning"],["I seal the fate of an ulcer with a protective barrier.","shield"],["Take me on an empty stomach, ~1 hour before meals.","clock"]],"facts":[["Class","Mucosal protectant"],["Action","Forms a protective barrier over the ulcer"],["Uses","Peptic ulcer disease"],["Watch for","Can bind and reduce absorption of other meds"],["Nursing pearl","Empty stomach; separate other meds by ~2 hours"]]},{"id":21,"group":"Pharmacology Review","cat":"gi","name":"Ondansetron","sub":"5-HT3 antagonist  ·  Zofran","clues":[["I block serotonin at 5-HT3 receptors.","brain"],["I prevent nausea and vomiting.","dizzy"],["Common in chemo, post-op, and pregnancy.","syringe"],["I can cause constipation and QT prolongation.","heart"]],"facts":[["Class","5-HT3 antagonist antiemetic"],["Action","Blocks serotonin (5-HT3) → prevents nausea/vomiting"],["Uses","Chemo, post-op, pregnancy-related nausea"],["Watch for","Constipation, headache, QT prolongation"],["Nursing pearl","Check QT and other QT-prolonging drugs"]]},{"id":22,"group":"Pharmacology Review","cat":"gi","name":"Bismuth Subsalicylate","sub":"Pepto-Bismol","clues":[["I’m an OTC pink liquid or chewable.","bottle"],["I coat your stomach and fight diarrhea.","stomach"],["I treat traveler’s diarrhea.","plane"],["I have antimicrobial effects against H. pylori.","bacteria"],["I can cause black tongue and black stools.","tongue"],["Avoid me if you’re allergic to aspirin.","warning"]],"facts":[["Class","Antidiarrheal / GI protectant"],["Action","Coats the stomach; mild antimicrobial vs H. pylori"],["Uses","Diarrhea, traveler’s diarrhea, upset stomach"],["Watch for","Harmless black tongue & stools; contains salicylate"],["Nursing pearl","Avoid if aspirin-allergic; caution in children (Reye’s)"]]},{"id":23,"group":"Pharmacology Review","cat":"pain","name":"Celecoxib","sub":"COX-2 selective NSAID","clues":[["I’m a prescription COX-2 selective NSAID.","capsule"],["I reduce pain and inflammation with less GI irritation.","shield"],["I’m used for arthritis and chronic pain.","bone"],["I can still raise your risk of heart problems.","heartcrack"]],"facts":[["Class","COX-2 selective NSAID"],["Action","Inhibits COX-2 → pain/inflammation relief, spares GI lining"],["Uses","Osteoarthritis, rheumatoid arthritis, chronic pain"],["Watch for","Cardiovascular risk; kidney injury; sulfa allergy"],["Nursing pearl","Fewer GI ulcers than traditional NSAIDs; caution in heart disease"]]},{"id":24,"group":"Pharmacology Review","cat":"pain","name":"Morphine / Opioids","sub":"Opioid analgesic","clues":[["I treat moderate to severe pain.","grimace"],["I bind to mu-opioid receptors in the brain.","brain"],["Watch out!!! Respiratory depression.","lungs"],["Constipation is common.","toilet"],["Tolerance and dependence can develop.","warning"],["I’m a controlled substance — monitor closely.","lock"]],"facts":[["Class","Opioid analgesic (controlled substance)"],["Action","Binds mu-opioid receptors in the CNS"],["Uses","Moderate-to-severe pain"],["Watch for","Respiratory depression, constipation, sedation, dependence"],["Nursing pearl","Naloxone reverses; monitor RR and sedation"]]},{"id":25,"group":"Pharmacology Review","cat":"gi","name":"Triple / Quadruple Therapy","sub":"H. pylori regimen","clues":[["I travel in packs.","boxes"],["I treat H. pylori.","bacteria"],["My pack includes antibiotics and PPIs.","pills"],["(multiple answers).","tags"]],"facts":[["What it is","Combination regimen to eradicate H. pylori"],["Includes","A PPI + two antibiotics (± bismuth for quadruple therapy)"],["Uses","Heal ulcers by clearing H. pylori"],["Watch for","Adherence; individual antibiotic side effects"],["Nursing pearl","Finish the whole regimen to prevent resistance"]]},{"id":26,"group":"Pharmacology Review","cat":"pain","name":"Ibuprofen","sub":"NSAID","clues":[["I’m an OTC nonsteroidal anti-inflammatory drug (NSAID).","capsule"],["I reduce pain, inflammation, and fever.","temp"],["I can upset your GI lining — take me with food.","stomach"],["Long-term use can hurt your kidneys and raise BP.","kidney"],["I may increase the risk of GI bleeding.","droplet"]],"facts":[["Class","NSAID (OTC)"],["Action","Inhibits COX → fewer prostaglandins"],["Uses","Pain, inflammation, fever"],["Watch for","GI bleeding/ulcers, kidney injury, raised BP"],["Nursing pearl","Take with food; caution with ulcers/kidney/blood thinners"]]},{"id":27,"group":"Pharmacology Review","cat":"gi","name":"Metoclopramide","sub":"Prokinetic  ·  Reglan","clues":[["I help your stomach empty faster into the intestine.","forward"],["I increase gastric motility — good for gastroparesis.","stomach"],["I block dopamine and serotonin in the brain and gut.","brain"],["I treat nausea and vomiting.","dizzy"],["I can cause drowsiness and diarrhea.","warning"]],"facts":[["Class","Prokinetic / antiemetic"],["Action","Blocks dopamine (and 5-HT3) → speeds gastric emptying"],["Uses","Gastroparesis, nausea/vomiting, reflux"],["Watch for","Drowsiness, diarrhea, EPS / tardive dyskinesia"],["Nursing pearl","Limit duration (<12 weeks) due to movement effects"]]},{"id":28,"group":"Pharmacology Review","cat":"gi","name":"Polyethylene Glycol","sub":"Osmotic laxative  ·  MiraLAX","clues":[["I’m an osmotic laxative that pulls water into the bowel.","glass"],["I work gently — softening stool over 1–3 days.","poop"],["I’m a powder you mix with water — tasteless and easy.","droplet"],["I’m great for chronic constipation.","clock"],["I rarely cause cramps or urgency.","feather"]],"facts":[["Class","Osmotic laxative"],["Action","Pulls water into the bowel to soften stool"],["Uses","Chronic constipation"],["Watch for","Gentle; rarely causes cramps or urgency"],["Nursing pearl","Tasteless powder in water; works in 1–3 days"]]},{"id":29,"group":"Pharmacology Review","cat":"gi","name":"Senna / Bisacodyl","sub":"Stimulant laxative  ·  Dulcolax","clues":[["I’m a stimulant laxative.","bolt"],["I get things moving fast.","running"],["I act on the colon’s nerves to trigger contractions.","poop"],["You’ll see results in 6–12 hours.","clock"],["I’m used for bowel prep or short-term relief.","toilet"],["Watch out!!! I can cause dependence.","warning"]],"facts":[["Class","Stimulant laxative"],["Action","Stimulates colon nerves → contractions"],["Uses","Constipation, bowel prep"],["Watch for","Cramping; dependence with overuse"],["Nursing pearl","Works in 6–12 hrs; short-term use only"]]},{"id":30,"group":"Pharmacology Review","cat":"gi","name":"Docusate Sodium","sub":"Stool softener  ·  Colace","clues":[["I’m a stool softener, not a true laxative.","feather"],["I let water and fat into the stool.","droplet"],["I help prevent straining — not for quick results.","poop"],["I’m ideal after surgery or childbirth.","baby"],["I’m gentle but slow.","clock"]],"facts":[["Class","Stool softener (surfactant)"],["Action","Lets water and fat into the stool"],["Uses","Prevent straining (post-op, childbirth, hemorrhoids)"],["Watch for","Gentle but slow; not for rapid relief"],["Nursing pearl","Best for prevention; keep fluids up"]]},{"id":31,"group":"Pharmacology Review","cat":"gi","name":"Psyllium Fiber","sub":"Bulk-forming laxative  ·  Metamucil","clues":[["I’m a bulk-forming laxative made from plant fiber.","wheat"],["I absorb water and swell to make soft, bulky stools.","glass"],["I work slowly — but I’m safe for daily use.","clock"],["Drink plenty of water with me or I’ll clog things up!","warning"],["Mix me with water or juice and chug!","glass"]],"facts":[["Class","Bulk-forming laxative (fiber)"],["Action","Absorbs water and swells → soft, bulky stool"],["Uses","Chronic constipation; safe for daily use"],["Watch for","Can clog/obstruct without enough water"],["Nursing pearl","Always take with a full glass of water"]]},{"id":32,"group":"Pharmacology Review","cat":"pain","name":"Acetaminophen","sub":"Analgesic / antipyretic  ·  Tylenol","clues":[["I relieve mild to moderate pain and reduce fever.","temp"],["I don’t reduce inflammation.","ban"],["I’m easy on the stomach — safe if you have ulcers.","stomach"],["I can NAPQI your LIVER at high doses.","liver"],["I’m often found in combo meds — check those labels!","tags"],["My daily maximum dose is: ______","warning"]],"facts":[["Class","Non-NSAID analgesic / antipyretic"],["Action","Reduces pain & fever centrally; little anti-inflammatory"],["Uses","Pain and fever; safe with ulcers"],["Watch for","Hepatotoxicity (NAPQI) at high doses"],["Nursing pearl","Max ~4 g/day; check combo products for hidden doses"]]},{"id":33,"group":"Pharmacology Review","cat":"cv","name":"Metoprolol","sub":"Beta blocker  ·  “-olol”","clues":[["I’m an OLOL.","pills"],["I Block Epi.","ban"],["I’m cardioselective — I attach to receptors on the myocardium.","heart"]],"facts":[["Class","Beta-1 selective blocker"],["Action","Blocks epinephrine at cardiac beta-1 → ↓ HR & BP"],["Uses","Hypertension, angina, post-MI, heart failure"],["Watch for","Bradycardia, hypotension, fatigue; masks hypoglycemia"],["Nursing pearl","Hold if HR <60 or low BP; never stop abruptly"]]},{"id":34,"group":"Pharmacology Review","cat":"resp","name":"Albuterol","sub":"Short-acting beta-2 agonist (SABA)","clues":[["Use me during an acute asthma attack.","lungs"],["I work to open up the airways.","wind"],["My drug class rhymes with the band “Abba.”","music"]],"facts":[["Class","Short-acting beta-2 agonist (SABA)"],["Action","Relaxes airway smooth muscle → bronchodilation"],["Uses","Acute asthma / COPD attacks (rescue inhaler)"],["Watch for","Tachycardia, tremor, jitteriness"],["Nursing pearl","Rescue—not maintenance; class rhymes with “Abba”"]]},{"id":35,"group":"Pharmacology Review","cat":"cv","name":"Amlodipine","sub":"Calcium channel blocker  ·  “-dipine”","clues":[["I’m a proud member of the Very Nice Drug Club.","pills"],["I love “dipping” in the peripheral blood vessels.","dilate"],["I open up those blood vessels.","heart"],["I can reduce BP — so check BP and follow parameters.","warning"]],"facts":[["Class","Dihydropyridine calcium channel blocker"],["Action","Relaxes peripheral blood vessels → vasodilation"],["Uses","Hypertension, angina"],["Watch for","Peripheral edema, flushing, headache, hypotension"],["Nursing pearl","Check BP and follow hold parameters"]]},{"id":36,"group":"Pharmacology Review","cat":"cv","name":"Epinephrine","sub":"Adrenergic agonist","clues":[["Emergency use only — I live on the crash cart.","ambulance"],["Much like running from a bear, I’m pure fight-or-flight.","bear"],["I increase heart rate and improve breathing.","heart"],["I open up the airways.","lungs"],["I trigger renin & vasoconstriction — blood rushes to your core organs.","bolt"]],"facts":[["Class","Adrenergic agonist (alpha & beta)"],["Action","Vasoconstriction, ↑ HR, bronchodilation (fight-or-flight)"],["Uses","Anaphylaxis, cardiac arrest, severe asthma"],["Watch for","Tachycardia, hypertension, arrhythmias"],["Nursing pearl","Emergency use; IM for anaphylaxis (EpiPen)"]]},{"id":37,"group":"Pharmacology Review","cat":"endo","name":"Sulfonylureas (Glyburide)","sub":"Insulin secretagogue","clues":[["I wake up the sleepy pancreas and ask for insulin.","syringe"],["I can cause hypoglycemia.","warning"],["So do NOT skip meals.","utensils"]],"facts":[["Class","Sulfonylurea — insulin secretagogue"],["Action","Stimulates the pancreas to release insulin"],["Uses","Type 2 diabetes"],["Watch for","Hypoglycemia (esp. if meals skipped), weight gain"],["Nursing pearl","Take with meals; don’t skip meals; sulfa caution"]]},{"id":38,"group":"Pharmacology Review","cat":"cv","name":"Hydralazine","sub":"Direct arterial vasodilator","clues":[["When I walk into a room, all eyes on me!","eye"],["People chant HAIL HYDRA.","hydra"],["I open up the vessels and let it flow.","dilate"],["I reduce BP.","heart"],["I can be taken PO or given IV.","syringe"]],"facts":[["Class","Direct arterial vasodilator"],["Action","Relaxes arteriolar smooth muscle → ↓ BP"],["Uses","Hypertension (incl. severe/emergency), heart failure"],["Watch for","Reflex tachycardia, headache, lupus-like syndrome"],["Nursing pearl","Can be PO or IV; monitor BP closely"]]},{"id":39,"group":"Pharmacology Review","cat":"endo","name":"Meglitinides (Repaglinide)","sub":"Short-acting secretagogue","clues":[["I wake up the sleepy pancreas and ask for insulin.","syringe"],["I can cause hypoglycemia.","warning"],["I’m short-lived, so take me more often — with each meal.","utensils"]],"facts":[["Class","Meglitinide — short-acting insulin secretagogue"],["Action","Stimulates the pancreas to release insulin"],["Uses","Type 2 diabetes — mealtime glucose control"],["Watch for","Hypoglycemia"],["Nursing pearl","Take with each meal; skip the dose if you skip the meal"]]},{"id":40,"group":"Pharmacology Review","cat":"endo","name":"Metformin","sub":"Biguanide","clues":[["I work in three ways: GI, Muscle, and Liver.","liver"],["I have low-to-no risk of hypoglycemia.","shield"],["I’m first-line treatment for most Type 2 diabetics.","pills"],["Watch out for those contrast dye studies.","vial"],["Wait ______ hrs before retaking me after a dye procedure.","clock"]],"facts":[["Class","Biguanide — first-line for Type 2 diabetes"],["Action","↓ Liver glucose output, ↑ insulin sensitivity (GI, muscle, liver)"],["Uses","Type 2 diabetes"],["Watch for","GI upset; rare lactic acidosis"],["Nursing pearl","Hold ~48 h around IV contrast; low hypoglycemia risk"]]},{"id":41,"group":"Pharmacology Review","cat":"cv","name":"Isosorbide Di/Mononitrate","sub":"Long-acting nitrate","clues":[["I open up blood vessels by increasing nitric oxide.","dilate"],["I’m long acting.","clock"],["I’m PO.","pills"],["I can be a “mono” or a “di.”","tags"]],"facts":[["Class","Long-acting nitrate vasodilator"],["Action","↑ Nitric oxide → dilates blood vessels"],["Uses","Chronic angina prevention (not acute attacks)"],["Watch for","Headache, hypotension, tolerance"],["Nursing pearl","PO; keep a daily nitrate-free interval; no PDE-5 drugs"]]},{"id":42,"group":"Pharmacology Review","cat":"endo","name":"Semaglutide","sub":"GLP-1 receptor agonist","clues":[["I mimic a gut hormone that helps with insulin release.","stomach"],["I slow digestion and keep blood sugar steady after meals.","utensils"],["I keep you full, so you eat less and lose weight.","weight"],["I’m injectable, but NOT insulin!","syringe"],["I might cause nausea or vomiting when you first start.","dizzy"]],"facts":[["Class","GLP-1 receptor agonist (incretin mimetic)"],["Action","↑ Insulin, slows gastric emptying, ↑ satiety"],["Uses","Type 2 diabetes; weight management"],["Watch for","Nausea/vomiting, pancreatitis risk"],["Nursing pearl","Injectable but NOT insulin; low hypoglycemia risk alone"]]},{"id":43,"group":"Pharmacology Review","cat":"cv","name":"Verapamil & Diltiazem","sub":"Non-DHP calcium channel blocker","clues":[["We are chill pills for the heart.","heartplain"],["We cause constipation.","toilet"],["We are members of the Very Nice Drug Club.","pills"],["We help with angina and BP.","heart"],["Do NOT use us in heart-failure patients.","ban"],["We are negative inotropes.","heartcrack"]],"facts":[["Class","Non-dihydropyridine calcium channel blockers"],["Action","Slow heart rate & conduction (negative inotrope/chronotrope)"],["Uses","Hypertension, angina, rate control (SVT / AFib)"],["Watch for","Constipation, bradycardia; avoid in heart failure"],["Nursing pearl","Not for HF (negative inotrope); monitor HR and BP"]]},{"id":44,"group":"Pharmacology Review","cat":"endo","name":"Canagliflozin","sub":"SGLT2 inhibitor  ·  “-flozin”","clues":[["My theme song: “Let it Flow, let it flow.”","water"],["I remove glucose from the body.","cube"],["I also protect the heart and kidneys.","shield"],["My location: the kidneys.","kidney"],["Downside: risk for dehydration and urinary infections.","warning"]],"facts":[["Class","SGLT2 inhibitor"],["Action","Blocks glucose reabsorption in the kidney → glucose out in urine"],["Uses","Type 2 diabetes; heart & kidney protection"],["Watch for","Genital / urinary infections, dehydration"],["Nursing pearl","“Let it flow” — glucose excreted in urine; keep hydrated"]]},{"id":45,"group":"Pharmacology Review","cat":"cv","name":"Atropine","sub":"Anticholinergic","clues":[["Row, row, row your heart — a-tropine speeds it up.","heart"],["I increase heart rate.","bolt"],["I’m used for symptomatic bradycardia.","heart"]],"facts":[["Class","Anticholinergic (antimuscarinic)"],["Action","Blocks acetylcholine at muscarinic receptors → ↑ heart rate"],["Uses","Symptomatic bradycardia; pre-op secretions; organophosphate poisoning"],["Watch for","Dry mouth, blurred vision, urinary retention, confusion"],["Nursing pearl","First-line for unstable bradycardia; lives on the crash cart"]]},{"id":46,"group":"Pharmacology Review","cat":"cv","name":"Clonidine","sub":"Central alpha-2 agonist","clues":[["Check the BP just before you give me.","heart"],["I’m central — chilling on the couch with our friend CLONY.","brain"],["I’m an alpha-2 agonist; I calm sympathetic outflow to lower BP.","dilate"],["Never stop me abruptly — rebound hypertension.","warning"]],"facts":[["Class","Central alpha-2 agonist"],["Action","Stimulates central alpha-2 → ↓ sympathetic outflow → ↓ BP & HR"],["Uses","Hypertension, ADHD, withdrawal, pain"],["Watch for","Sedation, dry mouth, bradycardia; rebound HTN if stopped"],["Nursing pearl","Check BP before each dose; taper — don’t stop suddenly"]]},{"id":47,"group":"Neuro · Antifungal · Antiviral","cat":"seiz","name":"Levetiracetam","sub":"Keppra · Antiepileptic","clues":[["I’m an anti-seizure medication.","brain"],["My exact mechanism isn’t fully understood.","gear"],["I treat both focal and generalized seizures.","bolt"],["I can cause mood swings, fatigue, and even suicidal ideation.","warning"],["I don’t need routine drug-level monitoring.","shield"]],"facts":[["Class","Antiepileptic — binds SV2A"],["Action","Modulates neurotransmitter release to reduce abnormal firing"],["Uses","Focal & generalized seizures; often first-line"],["Watch for","Mood/behavior changes, fatigue, suicidal ideation"],["Nursing pearl","No routine serum levels — monitor mood and behavior"]]},{"id":48,"group":"Neuro · Antifungal · Antiviral","cat":"seiz","name":"Phenytoin","sub":"Dilantin · Antiepileptic (hydantoin)","clues":[["I save the day by slowing neurons to prevent seizures.","brain"],["I require routine blood-level monitoring.","vial"],["I can cause “phuny”-looking gum overgrowth.","tooth"],["I’m a high-alert drug with a narrow therapeutic range.","warning"],["Too much of me? Watch for nystagmus and ataxia.","eye"]],"facts":[["Class","Antiepileptic (hydantoin) — high-alert"],["Action","Blocks voltage-gated Na⁺ channels; stabilizes membranes"],["Uses","Focal & tonic-clonic seizures; status epilepticus (IV)"],["Watch for","Gingival hyperplasia, hirsutism; nystagmus/ataxia"],["Nursing pearl","Level 10–20 mcg/mL; narrow index — monitor levels"]]},{"id":49,"group":"Neuro · Antifungal · Antiviral","cat":"seiz","name":"Lorazepam","sub":"Ativan · Benzodiazepine","clues":[["I’m first-line for status epilepticus.","bolt"],["I’m a benzodiazepine — a “downer.”","pills"],["I enhance GABA, the brain’s calming neurotransmitter.","brain"],["I can be given IV, IM, or orally.","syringe"],["I cause sedation — watch breathing and don’t drive.","lungs"]],"facts":[["Class","Benzodiazepine (CNS depressant)"],["Action","Enhances GABA-A → more chloride influx → calms the brain"],["Uses","Status epilepticus (first-line IV), anxiety, withdrawal"],["Watch for","Sedation, respiratory depression, dependence"],["Nursing pearl","Reversal = flumazenil; monitor RR; avoid alcohol"]]},{"id":50,"group":"Neuro · Antifungal · Antiviral","cat":"fung","name":"Antifungals","sub":"Drug class overview","clues":[["I battle yeast, mold, and other “fun guys.”","bacteria"],["…the ones that make your skin, hair, and nails go rogue.","rash"],["Many of my members’ names end in “-azole.”","tags"],["A lot of us target ergosterol in the fungal cell membrane.","shield"]],"facts":[["Class","Antifungals — treat fungal (yeast & mold) infections"],["Groups","Azoles, polyenes (nystatin, amphotericin B), echinocandins"],["Action","Disrupt ergosterol → damage the fungal cell membrane"],["Uses","Candidiasis, tinea, systemic fungal infections"],["Nursing pearl","Azoles inhibit CYP450 — monitor liver labs"]]},{"id":51,"group":"Neuro · Antifungal · Antiviral","cat":"fung","name":"Nystatin","sub":"Polyene antifungal · not a “statin”","clues":[["I’m the one, the only — “Swish and Spit.”","tongue"],["I treat oral thrush (candidiasis).","bacteria"],["Sometimes I’m a “Swish and Swallow” for esophageal infections.","stomach"],["Don’t confuse me with the lipid-lowering “statins.”","ban"]],"facts":[["Class","Polyene antifungal"],["Action","Binds ergosterol → pores in the fungal membrane"],["Uses","Oral & esophageal candidiasis; topical Candida"],["Route","Poorly absorbed — works locally (swish/spit or swallow)"],["Nursing pearl","NOT a cholesterol “statin”; minimal absorption"]]},{"id":52,"group":"Neuro · Antifungal · Antiviral","cat":"vir","name":"Acyclovir","sub":"Zovirax · Antiviral (nucleoside analog)","clues":[["I’m proud to be a “-VIR.”","virus"],["Remember to drink plenty of fluids with me.","glass"],["I can cause some nasty GI adverse effects.","stomach"],["I treat herpes, chickenpox, and shingles.","rash"]],"facts":[["Class","Antiviral — nucleoside (guanosine) analog"],["Action","Inhibits viral DNA polymerase (needs viral thymidine kinase)"],["Uses","Herpes (HSV), varicella, zoster (shingles)"],["Watch for","GI upset, headache, nephrotoxicity/crystalluria"],["Nursing pearl","Hydrate well; start early in an outbreak"]]},{"id":53,"group":"Neuro · Antifungal · Antiviral","cat":"vir","name":"HAART","sub":"Highly Active Antiretroviral Therapy","clues":[["My superpower: I reduce viral loads in HIV so patients live longer.","virus"],["I don’t fly solo — I need two to three medications.","boxes"],["My name sounds like “heart.”","heartplain"]],"facts":[["What I am","A combination regimen of antiretrovirals for HIV"],["Action","Different classes block several steps of HIV replication"],["Goal","Suppress viral load; preserve CD4 immune cells"],["Watch for","Adherence is critical — missed doses drive resistance"],["Nursing pearl","Combination prevents resistance; U = U"]]},{"id":54,"group":"Neuro · Antifungal · Antiviral","cat":"alz","name":"Donepezil","sub":"Aricept · Cholinesterase inhibitor","clues":[["I don’t cure the disease, but I help manage symptoms.","shield"],["My serious adverse effects are bradycardia and fainting.","heart"],["I might remind you of an individual named “Don.”","tags"],["I’m used for Alzheimer’s disease.","brain"]],"facts":[["Class","Acetylcholinesterase (AChE) inhibitor"],["Action","Blocks breakdown of ACh → more ACh → better cognition"],["Uses","Mild-to-severe Alzheimer’s (symptom management)"],["Watch for","Bradycardia, syncope, nausea, diarrhea"],["Nursing pearl","Cholinergic — monitor heart rate; often at bedtime"]]},{"id":55,"group":"Neuro · Antifungal · Antiviral","cat":"park","name":"Carbidopa / Levodopa","sub":"Sinemet · Antiparkinson agent","clues":[["A protein-rich meal blocks my absorption.","utensils"],["I hope you feel “dope” — I raise dopamine in the brain.","brain"],["I need my “car” (carbidopa) to enter the brain.","van"],["Take me on a schedule, or you’ll see the “on-off” phenomenon.","clock"],["During my “on” phase, Parkinson’s symptoms improve.","shield"]],"facts":[["Class","Dopamine precursor + decarboxylase inhibitor"],["Action","Levodopa → dopamine in brain; carbidopa stops peripheral breakdown"],["Uses","Parkinson’s disease"],["Watch for","Dyskinesias, orthostatic hypotension, “on-off” wearing off"],["Nursing pearl","Dose on schedule; separate from high-protein meals"]]}],"icons":{"speed":"<svg width=\"100%\" height=\"100%\" stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" viewBox=\"0 0 512 512\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zM288 96a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zM256 416c35.3 0 64-28.7 64-64c0-17.4-6.9-33.1-18.1-44.6L366 161.7c5.3-12.1-.2-26.3-12.3-31.6s-26.3 .2-31.6 12.3L257.9 288c-.6 0-1.3 0-1.9 0c-35.3 0-64 28.7-64 64s28.7 64 64 64zM176 144a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zM96 288a32 32 0 1 0 0-64 32 32 0 1 0 0 64zm352-32a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z\"></path></svg>","bolt":"<svg width=\"100%\" height=\"100%\" stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" viewBox=\"0 0 448 512\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M349.4 44.6c5.9-13.7 1.5-29.7-10.6-38.5s-28.6-8-39.9 1.8l-256 224c-10 8.8-13.6 22.9-8.9 35.3S50.7 288 64 288l111.5 0L98.6 467.4c-5.9 13.7-1.5 29.7 10.6 38.5s28.6 8 39.9-1.8l256-224c10-8.8 13.6-22.9 8.9-35.3s-16.6-20.7-30-20.7l-111.5 0L349.4 44.6z\"></path></svg>","gear":"<svg width=\"100%\" height=\"100%\" stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" viewBox=\"0 0 640 512\" xmlns=\ const PAL=["pal0","pal1","pal2","pal3","pal4","pal5"];
const app=document.getElementById("app");
const PKEY="wai_progress_v1";
function loadProg(){try{return JSON.parse(localStorage.getItem(PKEY)||"{}")}catch(e){return {}}}
function saveProg(){try{localStorage.setItem(PKEY,JSON.stringify(prog))}catch(e){}}
let prog=loadProg();
let state={mode:"start", set:null, shuffle:true, onlyNew:false, note:"", queue:[], idx:0, revealed:false, known:0, review:[], total:0};

const SETS=[
 {key:"all",big:"Everything",small:"Every card, both decks"},
 {key:"pharm",big:"Pharmacology Review",small:"Cardio, antibiotics, GI, endocrine & more"},
 {key:"neuro",big:"Neuro · Antifungal · Antiviral",small:"Seizures, Alzheimer’s, Parkinson’s, antivirals…"},
];
function filterFor(key){
 if(key==="all") return DATA.drugs.slice();
 if(key==="pharm") return DATA.drugs.filter(d=>d.group==="Pharmacology Review");
 return DATA.drugs.filter(d=>d.group.indexOf("Neuro")===0);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.min(i,Math.floor((i+1)*seededRand()));[a[i],a[j]]=[a[j],a[i]];}return a;}
let _s=1; function seededRand(){_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;}
function esc(x){return (x+"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function render(){ app.innerHTML=""; if(state.mode==="start")start(); else if(state.mode==="play")play(); else end(); }

function start(){
 const h=document.createElement("div");
 const counts={},done={};
 SETS.forEach(s=>{const l=filterFor(s.key);counts[s.key]=l.length;done[s.key]=l.filter(d=>prog[d.name]==="known").length;});
 const allL=filterFor("all"); const mastered=allL.filter(d=>prog[d.name]==="known").length;
 const pct=allL.length?Math.round(mastered/allL.length*100):0;
 h.innerHTML=`<div class="hero"><p class="kick">PHARMACOLOGY · FLASHCARDS</p><h1>Who Am I?</h1><p>Read the icon clues, guess the drug, then flip for the answer.</p></div>
 <div class="wrap">
 <div class="summary"><div class="ring" style="--p:${pct}"><span>${pct}%</span></div><div><div class="sbig">${mastered} of ${allL.length} completed</div><div class="ssmall">Progress saves on this device.${mastered?' <a id="reset">Reset</a>':''}</div></div></div>
 ${state.note?`<div class="note">${state.note}</div>`:""}
 <div class="sec">Choose a set</div>
 ${SETS.map(s=>`<button class="setbtn" data-k="${s.key}"><div><div class="big">${s.big}</div><div class="small">${s.small}</div></div><div class="count"><b>${counts[s.key]}</b><i>${done[s.key]?"✓ "+done[s.key]:""}</i></div></button>`).join("")}
 <div class="toggle"><div class="sw ${state.onlyNew?'on':''}" id="swn"><i></i></div> Only cards I haven’t completed</div>
 <div class="toggle"><div class="sw ${state.shuffle?'on':''}" id="sw"><i></i></div> Shuffle cards</div></div>
 <div class="startbar"><button class="primary" id="go" disabled>Start</button></div>`;
 app.appendChild(h); state.note="";
 if(state.set){const pb=h.querySelector(`.setbtn[data-k="${state.set}"]`);if(pb){pb.classList.add("sel");h.querySelector("#go").disabled=false;}}
 h.querySelectorAll(".setbtn").forEach(b=>b.onclick=()=>{state.set=b.dataset.k;h.querySelectorAll(".setbtn").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");h.querySelector("#go").disabled=false;});
 h.querySelector("#sw").onclick=e=>{state.shuffle=!state.shuffle;e.currentTarget.classList.toggle("on",state.shuffle);};
 h.querySelector("#swn").onclick=e=>{state.onlyNew=!state.onlyNew;e.currentTarget.classList.toggle("on",state.onlyNew);};
 const rb=h.querySelector("#reset"); if(rb)rb.onclick=()=>{if(confirm("Reset your progress on this device?")){prog={};saveProg();render();}};
 h.querySelector("#go").onclick=()=>startPlay();
}
function startPlay(){
 let list=filterFor(state.set);
 if(state.onlyNew) list=list.filter(d=>prog[d.name]!=="known");
 if(list.length===0){ state.note="You’ve completed every card in this set! 🎉  Turn off “Only cards I haven’t completed” to review them again."; render(); return; }
 _s=Math.floor((new Date().getTime())%2000000000)||1;
 if(state.shuffle) shuffle(list);
 state.queue=list; state.idx=0; state.revealed=false; state.known=0; state.review=[]; state.total=list.length; state.mode="play"; render();
}
function play(){
 const d=state.queue[state.idx];
 const wrap=document.createElement("div"); wrap.style.flex="1";wrap.style.display="flex";wrap.style.flexDirection="column";
 const done=state.idx; const pct=Math.round(done/state.total*100);
 wrap.innerHTML=`<div class="topbar"><button class="iconbtn" id="home">&#8592;</button><div class="prog"><div class="bar"><i style="width:${pct}%"></i></div><div class="ptext">Card ${state.idx+1} of ${state.total} &nbsp;·&nbsp; ${state.known} known</div></div></div>
 <div class="stage"><div class="card" id="card"></div></div>
 <div class="actions" id="actions"></div>`;
 app.appendChild(wrap);
 wrap.querySelector("#home").onclick=()=>{state.mode="start";render();};
 drawFace(wrap,d);
}
function iconHTML(concept,i){return `<span class="ic ${PAL[i%6]}">${DATA.icons[concept]||"?"}</span>`;}
function drawFace(wrap,d){
 const card=wrap.querySelector("#card"); const act=wrap.querySelector("#actions");
 if(!state.revealed){
  card.innerHTML=`<div class="face"><div class="whoami">Who Am I?</div>${d.clues.map((c,i)=>`<div class="clue">${iconHTML(c[1],i)}<div class="txt">${esc(c[0])}</div></div>`).join("")}</div>`;
  act.innerHTML=`<div style="flex:1"><button class="reveal" id="rev" style="width:100%">Reveal Answer</button><div class="hint">or tap the card</div></div>`;
  card.onclick=reveal; act.querySelector("#rev").onclick=reveal;
 } else {
  const cc=DATA.cats[d.cat]||{c:"1B3B6F",t:"E8EEF7"};
  card.innerHTML=`<div class="face"><span class="chip" style="background:#${cc.c}">ANSWER</span>
   <div class="ansname" style="color:#${cc.c}">${esc(d.name)}</div><div class="anssub">${esc(d.sub)}</div>
   ${d.facts.map(f=>`<div class="fact"><div class="flabel" style="background:#${cc.c}">${esc(f[0])}</div><div class="ftext">${esc(f[1])}</div></div>`).join("")}</div>`;
  act.innerHTML=`<div style="flex:1"><button class="grade again" id="again" style="width:100%">Review 🔁</button><div class="hint">Missed it? Tap here — the card is added to a review list you can redo at the end.</div></div><div style="flex:1"><button class="grade know" id="know" style="width:100%">Got it ✓</button><div class="hint">Got it right? Tap here so your progress is tracked.</div></div>`;
  card.onclick=null;
  act.querySelector("#know").onclick=()=>grade(true);
  act.querySelector("#again").onclick=()=>grade(false);
 }
}
function reveal(){state.revealed=true;const wrap=app.firstChild;drawFace(wrap,state.queue[state.idx]);}
function grade(ok){
 const cur=state.queue[state.idx];
 prog[cur.name]= ok?"known":"review"; saveProg();
 if(ok)state.known++; else state.review.push(cur);
 state.idx++; state.revealed=false;
 if(state.idx>=state.queue.length){ state.mode="end"; }
 render();
}
function end(){
 const div=document.createElement("div"); div.style.flex="1";div.style.display="flex";div.style.flexDirection="column";
 const pct=state.total?Math.round(state.known/state.total*100):0;
 div.innerHTML=`<div class="hero" style="border-radius:0 0 26px 26px"><p class="kick">SESSION COMPLETE</p><h1>Nice work!</h1><p>You reviewed ${state.total} cards.</p></div>
  <div class="endwrap"><div class="big2">${pct}%</div>
  <div class="statrow"><div class="stat"><b style="color:#2E8B57">${state.known}</b><span>Got it</span></div><div class="stat"><b style="color:#E8703A">${state.review.length}</b><span>To review</span></div></div>
  <div style="margin-top:18px;display:flex;flex-direction:column;gap:10px;max-width:360px;margin-left:auto;margin-right:auto;width:100%">
   ${state.review.length?'<button class="primary" id="rev">Review the '+state.review.length+' missed cards</button>':''}
   <button class="primary" id="restart" style="background:#334155">Restart this set</button>
   <button class="primary" id="menu" style="background:#64748B">Back to menu</button></div></div>`;
 app.appendChild(div);
 if(state.review.length)div.querySelector("#rev").onclick=()=>{state.queue=state.shuffle?shuffle(state.review.slice()):state.review.slice();state.total=state.queue.length;state.idx=0;state.known=0;state.review=[];state.revealed=false;state.mode="play";render();};
 div.querySelector("#restart").onclick=()=>startPlay();
 div.querySelector("#menu").onclick=()=>{state.mode="start";render();};
}
render();
</script></body></html>
